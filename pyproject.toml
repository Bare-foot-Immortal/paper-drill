# 代码检查与测试配置（ruff / pytest）
#
# 说明：本仓库由 AI 开发，配置同样由 AI 维护；规则集刻意收敛到"真实缺陷"导向，
# 不追求风格洁癖，避免为了通过检查而大面积改写已验证过的代码。

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv", "build", "dist", "fixtures", "samples/*.json"]

[tool.ruff.lint]
# E4/E7/E9：语法与空白错误；F：未使用变量/导入等 pyflakes 检查；
# W：警告；I：导入顺序；B：常见陷阱（bugbear）；C4：简化推导式
select = ["E4", "E7", "E9", "F", "W", "I", "B", "C4"]
ignore = [
    "E501",   # 行长度交给阅读习惯与文档排版决定（中文行不易按字符断行）
]

[tool.ruff.lint.per-file-ignores]
# 测试里需要断言 tkinter 不可用等场景，允许在 except 中直接 raise（已带 from）
"tests/*" = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 测试为 unittest 风格，pytest 可直接收集运行
python_files = ["test_*.py"]
