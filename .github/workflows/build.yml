name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 生成合成示例题库与测试夹具
        run: python tools/make_samples.py

      - name: 代码检查（ruff）
        run: ruff check src tools tests

      - name: 运行测试（pytest）
        env:
          PYTHONIOENCODING: utf-8
        run: pytest -q --junitxml=pytest.xml

      - name: 测试健康检查（防止夹具缺失导致整片静默跳过）
        run: python tools/check_test_health.py pytest.xml

      - name: 生成图标
        run: python tools/make_icon.py

      - name: 打包单文件 exe
        shell: pwsh
        run: ./build_exe.ps1 -SkipTests

      - name: exe 烟测（导入合成题库，校验退出码与题目数）
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP "smoke.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          & ./dist/PaperDrill.exe --bank fixtures/样例题库.xlsx --stats-only --log $log
          if ($LASTEXITCODE -ne 0) { throw "exe 退出码 $LASTEXITCODE" }
          $text = Get-Content $log -Raw -Encoding UTF8
          if ($text -notmatch "共\s*52\s*题") { throw "exe 未正确解析题库：$text" }
          Write-Host "[OK] exe 烟测通过"

      - name: 上传构建产物（工作流附件）
        uses: actions/upload-artifact@v4
        with:
          name: PaperDrill-windows-x64
          path: dist/PaperDrill.exe

      - name: 打 tag 时附带发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PaperDrill.exe
          body: |
            由 GitHub Actions 自动构建（AI 开发，见 AI-DEVELOPED.md）。
            下载 `PaperDrill.exe` 即可直接运行（Windows 10/11 x64，免安装、免联网）。
