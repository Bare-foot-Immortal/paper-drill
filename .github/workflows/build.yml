name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
  # Qt 界面测试在无显示环境下用 offscreen 平台运行
  QT_QPA_PLATFORM: offscreen

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 生成合成示例题库与测试夹具
        run: python tools/make_samples.py

      - name: 生成应用图标
        run: python tools/make_icon.py

      - name: 确认 PySide6 可用（防止 Qt 测试整片静默跳过）
        run: |
          python -c "import PySide6; from PySide6.QtWidgets import QApplication; print('PySide6', PySide6.__version__)"

      - name: 代码检查（ruff）
        run: ruff check src tools tests

      - name: 运行测试（pytest）
        env:
          PYTHONIOENCODING: utf-8
          QT_QPA_PLATFORM: offscreen
        run: pytest -q --junitxml=pytest.xml

      - name: 测试健康检查（防止夹具缺失导致整片静默跳过）
        run: python tools/check_test_health.py pytest.xml

      - name: Qt 界面无头自检（端到端闭环）
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          python -m paperdrill --qt-selftest --bank fixtures/样例题库.xlsx --out build/qt_selftest_progress --result build/qt_selftest.json

      - name: 打包单文件 exe
        shell: pwsh
        run: ./build_exe.ps1 -SkipTests

      - name: exe 烟测（导入合成题库，校验退出码与题目数）
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP "smoke.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          # GUI 子系统的 exe 用 & 调用不会设置 $LASTEXITCODE，必须 Start-Process -Wait -PassThru
          $proc = Start-Process -FilePath "./dist/PaperDrill.exe" -ArgumentList @("--bank", "fixtures/样例题库.xlsx", "--stats-only", "--log", $log) -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "exe 退出码 $($proc.ExitCode)" }
          if (-not (Test-Path $log)) { throw "exe 未生成日志：$log" }
          $text = Get-Content $log -Raw -Encoding UTF8
          if ($text -notmatch "共\s*52\s*题") { throw "exe 未正确解析题库：$text" }
          Write-Host "[OK] exe 烟测通过"

      - name: exe 烟测（Qt 界面自检闭环 + 图标/版本）
        shell: pwsh
        run: |
          $out = Join-Path $env:TEMP ("pd_qt_smoke_" + [Guid]::NewGuid().ToString('N').Substring(0, 8))
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $result = Join-Path $out "result.json"
          $env:QT_QPA_PLATFORM = 'offscreen'
          $proc = Start-Process -FilePath "./dist/PaperDrill.exe" `
            -ArgumentList @("--qt-selftest", "--bank", "fixtures/样例题库.xlsx", "--out", (Join-Path $out 'progress'), "--result", $result) `
            -Wait -PassThru
          Remove-Item Env:\QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) { throw "Qt 自检退出码 $($proc.ExitCode)" }
          if (-not (Test-Path $result)) { throw "未生成自检结果：$result" }
          $data = Get-Content -Raw -Encoding UTF8 $result | ConvertFrom-Json
          if (-not $data.ok) { throw "Qt 自检未通过：stage=$($data.stage) error=$($data.error)" }
          if (-not $data.icon.file_exists -or -not $data.icon.app_icon_ok -or -not $data.icon.window_icon_ok) {
            throw "应用图标自检未通过：$($data.icon | ConvertTo-Json -Compress)"
          }
          Write-Host "[OK] exe Qt 自检通过（版本 $($data.version)，图标 $($data.icon.path)）"

      - name: 上传构建产物（工作流附件）
        uses: actions/upload-artifact@v4
        with:
          name: PaperDrill-windows-x64
          path: dist/PaperDrill.exe

      - name: 打 tag 时附带发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PaperDrill.exe
          body: |
            由 GitHub Actions 自动构建，下载 `PaperDrill.exe` 即可直接运行
            （Windows 10/11 x64，免安装、免联网）。
